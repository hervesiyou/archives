{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Inscription d'un Utilisateur {% endblock %}
{% block content %}

<div class="row">
    <div class="col-lg-3"></div>
    <div class="col-lg-6">
        <h3 class="bg-success text-center text-white">  Inscription d'un Utilisateur  </h3>
        <p>  Merci de nous en dire plus    </p>

        <form action="" method="post" validate >
            {% csrf_token %}
            {% crispy form %}

            <div class="h-captcha" data-sitekey="{{ HCAPTCHA }}" data-callback="enableCommandeButton"></div>

            <input 
            type="submit" 
             disabled  
            class="btn btn-info" id="InsID" value="M'inscrire" />
        </form>

    </div>
    <div class="col-lg-3"></div>
</div>

<script>
        function enableCommandeButton() {  
       
            document.getElementById('InsID').disabled = false;
        }
    </script>

{% endblock %}
