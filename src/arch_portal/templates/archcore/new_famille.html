{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Nouvelle Famille {% endblock %}
{% block css %} 
  <style>
    .div-check{ 
        margin: 37px 0 31px 0; 
        height: 5px;
    }
</style>
{% endblock %}
{% block content %}
   
    <div class="container card-body">
    <div class="my-4">
        <a href="{% url 'home' %}" class="my-2"> <i class="fa fa-home"></i> Accueil </a>  >
        <a href="{% url 'listcom' %}" class="my-2"> <i class="fas fa-users"></i> Communautés </a> 
    </div>
        <h3> Nouvelle Famille</h3>
        <div class="row">
            
            <div class="col-lg-12">
                <h5 class="bg-info text-center">.{{id}}</h5>
                
                <form method="post">
                    {% csrf_token %}
                    {% crispy form %} 
                     

                    <input type="submit" class="btn btn-success" value="Ajouter cette Famille" />
                </form>
            </div> 
        </div>
    </div>
        <br/>
 {% endblock %}
